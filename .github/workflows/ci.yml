name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Installe les dependances
        run: pip install -r requirements-dev.txt

      - name: Lance les tests
        run: python -m pytest --cov=src --cov-report=term

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Construit l'image
        run: docker build -t scoring-api:${{ github.sha }} .

      - name: Demarre le conteneur
        run: |
          docker run -d --name scoring -p 8000:7860 \
            scoring-api:${{ github.sha }}

      - name: Attend le demarrage
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "Service pret apres ${i} tentatives."
              exit 0
            fi
            sleep 2
          done
          docker logs scoring
          exit 1

      # Le build n'importe jamais lightgbm : seule une prediction reelle valide
      # le modele dans l'image. 0.8344 est le score connu du client 100002.
      - name: Verifie une prediction connue
        run: |
          reponse=$(curl -sf -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"SK_ID_CURR": 100002}')
          echo "$reponse"
          echo "$reponse" | grep -q '"score_risque":0.8344'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # lfs sans objet aujourd'hui : le depot GitHub n'en declare aucun. Garde
      # car l'oubli echouerait en silence, un pointeur etant copie a la place du
      # magasin et le conteneur ne plantant qu'au demarrage.
      - uses: actions/checkout@v4
        with:
          lfs: true

      # LFS ouvre sa propre connexion et ne reprend pas les identifiants de
      # l'URL du depot : le jeton doit lui etre fourni separement.
      - name: Clone le Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git lfs install
          git config --global credential.helper store
          echo "https://Fatih09:${HF_TOKEN}@huggingface.co" > ~/.git-credentials
          git clone \
            "https://huggingface.co/spaces/Fatih09/home-credit-scoring-api" \
            "${RUNNER_TEMP}/space"

      - name: Copie les fichiers attendus par le Dockerfile
        run: |
          cd "${RUNNER_TEMP}/space"
          mkdir -p src artifacts data
          cp "${GITHUB_WORKSPACE}/Dockerfile" .
          cp "${GITHUB_WORKSPACE}/requirements.txt" .
          cp "${GITHUB_WORKSPACE}"/src/*.py src/
          cp "${GITHUB_WORKSPACE}"/artifacts/model.pkl artifacts/
          cp "${GITHUB_WORKSPACE}"/artifacts/feature_names.json artifacts/
          cp "${GITHUB_WORKSPACE}"/artifacts/categories.json artifacts/
          cp "${GITHUB_WORKSPACE}"/data/store.parquet data/

      # git commit sort en erreur quand rien n'a change, ce qui arrive des
      # qu'une fusion ne touche aucun fichier copie ci-dessus. Sans cette
      # condition, le pipeline echouerait sans qu'aucun probleme reel existe.
      - name: Publie sur le Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          cd "${RUNNER_TEMP}/space"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Aucun changement a publier."
          else
            git commit -m "Deploiement depuis ${GITHUB_SHA}"
            git push \
              "https://Fatih09:${HF_TOKEN}@huggingface.co/spaces/Fatih09/home-credit-scoring-api" \
              main
          fi